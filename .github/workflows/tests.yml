name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --no-interaction && exit 0
            echo "composer install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
          exit 1
        env:
          # Without this, Composer's package downloads from codeload.github.com
          # are unauthenticated and share GitHub's 60/hr rate limit across
          # every Actions runner's IP pool, which reliably 429s. Authenticating
          # with the job's own token raises that to 5000/hr. The retry loop
          # covers GitHub's separate, shorter-window secondary rate limit,
          # which can still trip even when authenticated.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Retry job on transient infra failure
        # GitHub's runners occasionally fail to download actions from
        # codeload.github.com (429/502, or an "Internal server error") before
        # any of our steps even run. That's not retryable via a shell loop,
        # so instead we ask GitHub to rerun the whole (failed) job, capped at
        # 3 total attempts to avoid looping forever on a real failure.
        if: failure() && fromJSON(github.run_attempt) < 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run rerun ${{ github.run_id }} --failed
